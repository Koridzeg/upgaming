[project]
name = "investigator"
version = "0.1.0"
description = "AI Investigation Engine: multi-document, multi-hop RAG with citations"
requires-python = ">=3.12"
# Dependencies are added in the step that first needs them, so each step's diff explains itself.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "numpy>=2.1",
    # Document loaders
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    # Chunking: the embedding model's own tokenizer
    "tokenizers>=0.20",
    # Embeddings
    "onnxruntime>=1.20",
    # LLM API calls (also what FastAPI's TestClient uses)
    "httpx2>=2.16",
]

[project.optional-dependencies]
# Only for preparing datasets (run locally); the deployed app doesn't install these.
data = [
    "pyarrow>=18",
    "fpdf2>=2.8",
    "onnx>=1.17",  # only to produce the int8 model file (python -m investigator.embedding)
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["investigator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
